<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IF Clubes</title>
</head>
<body>
    <main>
        <h1>IF Clubes</h1>
        <p>Encontre clubes e grupos de interesse do IFRN.</p>
        <p><a href="{{ url_for('list_clubs') }}">Explorar clubes</a></p>
        <p><a href="{{ url_for('list_events') }}">Ver eventos</a></p>
        {% if session.get('usuario_id') %}
            <p>Olá, {{ session.get('nome') }}.</p>
            {% if session.get('tipo') == 'responsavel' %}
                <p><a href="{{ url_for('create_club') }}">Cadastrar clube</a></p>
                <p><a href="{{ url_for('create_event') }}">Cadastrar evento</a></p>
            {% endif %}
            <form action="{{ url_for('logout') }}" method="post">
                <button type="submit">Sair</button>
            </form>
        {% else %}
            <a href="{{ url_for('login') }}">Entrar</a>
            <a href="{{ url_for('register_user') }}">Criar uma conta</a>
        {% endif %}
    </main>
</body>
</html>
