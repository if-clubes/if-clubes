<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | IF Clubes</title>
</head>
<body>
    <main>
        <h1>Entrar</h1>
        <p>Acesse sua conta do IF Clubes.</p>

        {% if error_message %}
            <p role="alert">{{ error_message }}</p>
        {% endif %}

        <form action="{{ url_for('login') }}" method="post">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" maxlength="254" value="{{ email }}" autocomplete="email" required>

            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" required>

            <button type="submit">Entrar</button>
        </form>

        <p><a href="{{ url_for('register_user') }}">Criar uma conta</a></p>
        <p><a href="{{ url_for('index') }}">Voltar ao início</a></p>
    </main>
</body>
</html>
