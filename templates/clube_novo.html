<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ 'Editar clube' if clube_id else 'Cadastrar clube' }} | IF Clubes</title>
</head>
<body>
    <main>
        <h1>{{ 'Editar clube' if clube_id else 'Cadastrar clube' }}</h1>

        {% if error_message %}
            <p role="alert">{{ error_message }}</p>
        {% endif %}

        <form action="{{ url_for('edit_club', club_id=clube_id) if clube_id else url_for('create_club') }}" method="post">
            <label for="nome">Nome do clube</label>
            <input id="nome" name="nome" type="text" maxlength="120" value="{{ nome }}" required>

            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" maxlength="5000" required>{{ descricao }}</textarea>

            <label for="categoria">Categoria</label>
            <input id="categoria" name="categoria" type="text" maxlength="80" value="{{ categoria }}" required>

            <label for="local">Local dos encontros</label>
            <input id="local" name="local" type="text" maxlength="180" value="{{ local }}" required>

            <label for="horarios">Horários dos encontros</label>
            <input id="horarios" name="horarios" type="text" maxlength="180" value="{{ horarios }}" required>

            <button type="submit">{{ 'Salvar alterações' if clube_id else 'Salvar clube' }}</button>
        </form>

        <p><a href="{{ url_for('list_clubs') }}">Voltar para clubes</a></p>
    </main>
</body>
</html>
