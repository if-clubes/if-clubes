<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta | IF Clubes</title>
</head>
<body>
    <main>
        <h1>Criar conta</h1>
        <p>Cadastre-se para participar dos clubes do IFRN.</p>

        {% if error_message %}
            <p role="alert">{{ error_message }}</p>
        {% endif %}
        {% if success_message %}
            <p role="status">{{ success_message }}</p>
        {% endif %}

        <form action="{{ url_for('register_user') }}" method="post">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" maxlength="120" value="{{ nome }}" required>

            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" maxlength="254" value="{{ email }}" required>

            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" minlength="8" autocomplete="new-password" required>

            <label for="tipo">Perfil</label>
            <select id="tipo" name="tipo" required>
                <option value="aluno" {% if tipo == 'aluno' %}selected{% endif %}>Aluno</option>
                <option value="responsavel" {% if tipo == 'responsavel' %}selected{% endif %}>Responsável por clube</option>
            </select>

            <button type="submit">Criar conta</button>
        </form>

        <p><a href="{{ url_for('login') }}">Já tenho uma conta</a></p>
        <p><a href="{{ url_for('index') }}">Voltar ao início</a></p>
    </main>
</body>
</html>
